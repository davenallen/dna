    <div class="wrap bar-inner">
      <a class="brand" href="#top">

          <strong data-field="brand"></strong>

        <div class="paths" data-paths="hero"></div>
        <div class="quiz" data-quiz hidden></div>

      <div class="wrap">

        <div>
