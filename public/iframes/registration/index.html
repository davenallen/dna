<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Tag Manager -->
  <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
  new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
  j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
  'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
  })(window,document,'script','dataLayer','GTM-KWBDRV2H');</script>
  <!-- End Google Tag Manager -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reserve a seat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="landing.css">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-KWBDRV2H"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->
  <header class="bar section-alt">
    <div class="wrap bar-inner">
      <a href="/"><img class="mark" data-field="mark" alt=""></a >
      <p class="bar-when"><span data-field="whenLabel"></span> · <span data-field="timeLabel"></span></p>
      <a class="bar-link" href="#register">Reserve a seat</a>
    </div>
  </header>

  <main>
    <section class="hero on-dark" id="register">
      <div class="wrap hero-grid">
        <div class="hero-copy">
          <div class="hero-text">
            <p class="eyebrow" data-field="eyebrow"></p>
            <h1 data-field="headline"></h1>
            <p class="lede" data-field="subhead"></p>
          </div>
          <ul class="checks" data-list="checks"></ul>
        </div>
        <div class="card">
          <p class="card-kicker" data-field="eyebrow"></p>
          <p class="card-when"><span data-field="whenLabel"></span><span data-field="timeLabel"></span></p>
          <form class="lead-form" novalidate>
            <label>
              <span>Email</span>
              <span class="field-control">
                <input type="email" name="email" autocomplete="email" inputmode="email" placeholder="you@email.com">
                <span class="field-icon" aria-hidden="true">@</span>
              </span>
            </label>
            <button class="button" type="submit" data-field="button"></button>
            <p class="form-error" role="alert" hidden>Enter an email address.</p>
            <p class="form-note" data-field="note"></p>
          </form>
          <form class="remind-form" novalidate hidden>
            <p class="remind-title" data-field="remindHeadline"></p>
            <p class="remind-lead" data-field="remindLede"></p>
            <label>
              <span data-field="remindLabel"></span>
              <span class="field-control">
                <input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="(303) 555-0100">
                <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6.6 3.8c.4-.4 1-.5 1.5-.3l2.4 1a1.2 1.2 0 0 1 .7 1.4L10.4 8.6a1.2 1.2 0 0 1-1.1.9c-.3 0-.5.1-.6.4a7.6 7.6 0 0 0 4.4 4.4c.3-.1.4-.3.4-.6a1.2 1.2 0 0 1 .9-1.1l2.7-.8a1.2 1.2 0 0 1 1.4.7l1 2.4c.2.5.1 1.1-.3 1.5l-1.4 1.4c-.5.5-1.2.7-1.9.6C9.6 17.6 5.4 13.4 4.6 7.1c-.1-.7.1-1.4.6-1.9l1.4-1.4z"/></svg></span>
              </span>
            </label>
            <p class="privacy" data-field="remindNote"></p>
            <button class="button" type="submit" data-field="remindButton"></button>
            <button class="button button-ghost" type="button" data-remind-skip data-field="remindSkip"></button>
            <p class="form-error" role="alert" hidden data-field="remindEmpty"></p>
          </form>
          <div class="done" hidden>
            <p class="done-title">Seat reserved.</p>
            <p class="done-email"></p>
            <ul class="done-list"></ul>
            <p class="done-note"></p>
            <div class="cal">
              <a class="button button-ghost" data-calendar target="_blank" rel="noopener noreferrer">Google Calendar</a>
              <button class="button button-ghost" type="button" data-ics>Download .ics</button>
            </div>
            <div class="onboard" data-onboard></div>
          </div>
          <ul class="facts">
            <li><span>Length</span><strong data-field="length"></strong></li>
            <li><span>Where</span><strong data-field="where"></strong></li>
          </ul>
        </div>
      </div>
    </section>

    <section class="section" data-section="benefits">
      <div class="wrap">
        <h2 data-field="sectionBenefits"></h2>
        <div class="cards" data-list="benefits"></div>
      </div>
    </section>

    <section class="section section-alt" data-section="agenda">
      <div class="wrap narrow">
        <h2 data-field="sectionAgenda"></h2>
        <ol class="agenda" data-list="agenda"></ol>
      </div>
    </section>

    <section class="section" data-section="fit">
      <div class="wrap">
        <h2 data-field="sectionFit"></h2>
        <div class="cards" data-list="fit"></div>
      </div>
    </section>

    <section class="section section-alt" data-section="faq">
      <div class="wrap narrow">
        <h2 data-field="sectionFaq"></h2>
        <div class="faq" data-list="faqs"></div>
      </div>
    </section>

    <section class="close on-dark" id="reserve">
      <div class="wrap close-inner">
        <h2 data-field="closeHeadline"></h2>
        <p class="lede lede-on-dark" data-field="closeLede"></p>
        <div class="card card-on-dark">
          <form class="lead-form" novalidate>
            <label>
              <span>Email</span>
              <span class="field-control">
                <input type="email" name="email" autocomplete="email" inputmode="email" placeholder="you@email.com">
                <span class="field-icon" aria-hidden="true">@</span>
              </span>
            </label>
            <button class="button" type="submit" data-field="button"></button>
            <p class="form-error" role="alert" hidden>Enter an email address.</p>
            <p class="form-note" data-field="note"></p>
          </form>
          <form class="remind-form" novalidate hidden>
            <p class="remind-title" data-field="remindHeadline"></p>
            <p class="remind-lead" data-field="remindLede"></p>
            <label>
              <span data-field="remindLabel"></span>
              <span class="field-control">
                <input type="tel" name="phone" autocomplete="tel" inputmode="tel" placeholder="(303) 555-0100">
                <span class="field-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6.6 3.8c.4-.4 1-.5 1.5-.3l2.4 1a1.2 1.2 0 0 1 .7 1.4L10.4 8.6a1.2 1.2 0 0 1-1.1.9c-.3 0-.5.1-.6.4a7.6 7.6 0 0 0 4.4 4.4c.3-.1.4-.3.4-.6a1.2 1.2 0 0 1 .9-1.1l2.7-.8a1.2 1.2 0 0 1 1.4.7l1 2.4c.2.5.1 1.1-.3 1.5l-1.4 1.4c-.5.5-1.2.7-1.9.6C9.6 17.6 5.4 13.4 4.6 7.1c-.1-.7.1-1.4.6-1.9l1.4-1.4z"/></svg></span>
              </span>
            </label>
            <p class="privacy" data-field="remindNote"></p>
            <button class="button" type="submit" data-field="remindButton"></button>
            <button class="button button-ghost" type="button" data-remind-skip data-field="remindSkip"></button>
            <p class="form-error" role="alert" hidden data-field="remindEmpty"></p>
          </form>
          <div class="done" hidden>
            <p class="done-title">Seat reserved.</p>
            <p class="done-email"></p>
            <ul class="done-list"></ul>
            <p class="done-note"></p>
            <div class="cal">
              <a class="button button-ghost" data-calendar target="_blank" rel="noopener noreferrer">Google Calendar</a>
              <button class="button button-ghost" type="button" data-ics>Download .ics</button>
            </div>
            <div class="onboard" data-onboard></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="wrap">
      <p data-field="footer"></p>
    </div>
  </footer>

  <script src="/js/sheet-post.js"></script>
  <script src="/js/campaign-events.js"></script>
  <script src="campaign.js"></script>
  <script src="landing.js"></script>
</body>
</html>
